[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oldwares"
version = "0.1.0"
description = "ヤフオクとメルカリの検索結果を貼り付けて中古服の相場を調べるツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
oldwares = "oldwares.cli:main"

[tool.setuptools.packages.find]
include = ["oldwares*"]

[tool.setuptools.package-data]
oldwares = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
