[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oldwares"
version = "0.1.0"
description = "ヤフオクとメルカリの実売価格から中古服の相場を調べるツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyJWT>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
oldwares = "oldwares.cli:main"

[tool.setuptools.packages.find]
include = ["oldwares*"]

[tool.setuptools.package-data]
oldwares = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
